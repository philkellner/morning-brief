name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - name: Verify the pipeline runs offline against fixtures
        run: node scripts/build-digest.mjs --fixture scripts/fixtures/headlines.json --dry-run --limit 5
