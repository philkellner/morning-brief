name: Build morning digest

on:
  schedule:
    # GitHub cron is UTC only and has no notion of daylight saving, so we fire at
    # both candidate hours and let the job itself decide. 10:00 UTC is 05:00 in
    # Chicago during CDT; 11:00 UTC is 05:00 during CST. The guard below drops
    # whichever run is not actually 05:00 local.
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of stories'
        required: false
        default: '10'

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub cron is UTC-only and has no notion of daylight saving, so the
      # workflow fires at both candidate hours. Deciding by clock hour turned out
      # to be fragile: scheduled runs are queued, not punctual (the first real
      # one slipped 21 minutes), and a run delayed across the hour boundary would
      # fail an "is it 05:00?" test on BOTH firings, silently costing a day.
      #
      # So the gate asks the question that actually matters: has today's digest
      # been built yet? Whichever run arrives first does the work; the second
      # finds today's edition already committed and stops. That is correct under
      # CDT, under CST, and under any delay short of a full day.
      - name: Decide whether today's digest still needs building
        id: gate
        run: |
          TODAY="$(TZ=America/Chicago date +%F)"
          CURRENT="$(node -p "require('./docs/digest.json').edition" 2>/dev/null || echo none)"
          echo "Chicago date: $TODAY / committed edition: $CURRENT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - building regardless."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT" = "$TODAY" ]; then
            echo "Today's digest is already committed. Nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No digest for today yet - building."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '20'

      - name: Run tests
        if: steps.gate.outputs.run == 'true'
        run: npm test

      - name: Build digest
        if: steps.gate.outputs.run == 'true'
        run: node scripts/build-digest.mjs --limit "${{ github.event.inputs.limit || '10' }}"

      - name: Commit digest
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/digest.json docs/archive
          if git diff --staged --quiet; then
            echo "No change in digest - nothing to commit."
          else
            git commit -m "Digest for $(TZ=America/Chicago date +%Y-%m-%d)"
            git push
          fi
