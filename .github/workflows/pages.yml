name: Publish site

# Enables GitHub Pages and deploys docs/ - the Atom feed, the terminal-styled
# reader and the archive.
#
# actions/configure-pages with enablement:true turns Pages on from inside the
# workflow, using the runner's pages:write permission. The Pages REST API is not
# reachable from every environment, and this needs no settings click.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  # The daily digest commits with GITHUB_TOKEN, and pushes made with that token
  # deliberately do not trigger other workflows - so without this the feed would
  # update in the repository and never reach the site.
  workflow_run:
    workflows: ['Build morning digest']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Enable Pages if it is not already on
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Check the feed is actually present and well formed
        run: |
          test -f docs/feed.xml || { echo "docs/feed.xml is missing"; exit 1; }
          python3 -c "import xml.dom.minidom,sys; d=xml.dom.minidom.parse('docs/feed.xml'); n=len(d.getElementsByTagName('entry')); print(f'{n} entries'); sys.exit(0 if n>0 else 1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report the URL
        run: echo "Published ${{ steps.deploy.outputs.page_url }}feed.xml"
